<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% block title %}DevForum{% endblock %} — Programming Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css" />
{% block extra_head %}{% endblock %}
</head>
<body>

<!-- HEADER -->
<header>
  <a class="logo" href="/">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <rect x="2"  y="2"  width="7" height="7" rx="1.5" fill="var(--accent)" opacity=".9"/>
      <rect x="11" y="2"  width="7" height="7" rx="1.5" fill="var(--accent)" opacity=".5"/>
      <rect x="2"  y="11" width="7" height="7" rx="1.5" fill="var(--accent)" opacity=".5"/>
      <rect x="11" y="11" width="7" height="7" rx="1.5" fill="var(--accent)" opacity=".3"/>
    </svg>
    Dev<span>Forum</span>
  </a>
  <nav>
    <a class="nav-btn {% if active_page == 'home' %}active{% endif %}" href="/">Home</a>
    <a class="nav-btn {% if active_page == 'topics' %}active{% endif %}" href="/topics">Topics</a>
    <a class="nav-btn auth-only" id="nav-profile" href="/profile" style="display:none">My Profile</a>
    <a class="nav-btn admin-only" id="nav-admin" href="/admin" style="display:none">Admin</a>
  </nav>
  <div class="header-right" id="header-right">
    <!-- Filled by JS based on stored token -->
    <button class="btn btn-ghost btn-sm guest-only" onclick="openModal('login-modal')">Sign in</button>
    <button class="btn btn-primary btn-sm guest-only" onclick="openModal('register-modal')">Register</button>
    <div class="user-info auth-only" id="user-info" style="display:none"></div>
    <!-- Notification bell -->
    <div class="auth-only notif-wrap" id="notif-wrap" style="display:none;position:relative">
      <button class="notif-bell" id="notif-btn" onclick="toggleNotifPanel()" title="Invitations">
        🔔
        <span class="notif-badge" id="notif-badge" style="display:none">0</span>
      </button>
      <div class="notif-panel" id="notif-panel" style="display:none">
        <div class="notif-header">
          <span style="font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text3)">// Invitations</span>
          <button style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:1rem" onclick="toggleNotifPanel()">✕</button>
        </div>
        <div id="notif-list"><div class="loader" style="padding:1rem"><div class="spinner"></div></div></div>
      </div>
    </div>
    <button class="btn btn-ghost btn-sm auth-only" id="logout-btn" style="display:none" onclick="logout()">Sign out</button>
  </div>
</header>

<!-- TOAST -->
<div id="toast-container"></div>

<!-- PAGE CONTENT -->
<main>
  {% block content %}{% endblock %}
</main>

<!-- ═══════ MODALS ═══════ -->

<!-- LOGIN -->
<div class="modal-overlay" id="login-modal" onclick="overlayClose(event,'login-modal')">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Sign in to DevForum</div>
      <button class="modal-close" onclick="closeModal('login-modal')">✕</button>
    </div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="login-username" placeholder="your_username" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••"
             onkeydown="if(event.key==='Enter')doLogin()" />
    </div>
    <div class="error-msg" id="login-error"></div>
    <div class="form-footer">
      <div class="form-switch">No account?
        <a onclick="switchModal('login-modal','register-modal')">Register</a>
      </div>
      <button class="btn btn-primary" onclick="doLogin()">Sign In</button>
    </div>
  </div>
</div>

<!-- REGISTER -->
<div class="modal-overlay" id="register-modal" onclick="overlayClose(event,'register-modal')">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Create your account</div>
      <button class="modal-close" onclick="closeModal('register-modal')">✕</button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" id="reg-first" placeholder="John" />
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="reg-last" placeholder="Doe" />
      </div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="reg-email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="reg-username" placeholder="cooldev42" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="reg-password" placeholder="••••••••" />
    </div>
    <div class="error-msg"   id="reg-error"></div>
    <div class="success-msg" id="reg-success"></div>
    <div class="form-footer">
      <div class="form-switch">Already have one?
        <a onclick="switchModal('register-modal','login-modal')">Sign in</a>
      </div>
      <button class="btn btn-primary" onclick="doRegister()">Create Account</button>
    </div>
  </div>
</div>

<!-- EDIT REPLY -->
<div class="modal-overlay" id="edit-reply-modal" onclick="overlayClose(event,'edit-reply-modal')">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Edit Reply</div>
      <button class="modal-close" onclick="closeModal('edit-reply-modal')">✕</button>
    </div>
    <input type="hidden" id="edit-reply-id" />
    <div class="form-group">
      <label>Content</label>
      <textarea id="edit-reply-content" rows="5" placeholder="Your reply…"></textarea>
    </div>
    <div class="error-msg" id="edit-reply-error"></div>
    <div class="form-footer" style="justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal('edit-reply-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="submitEditReply()">Save Changes</button>
    </div>
  </div>
</div>

<!-- CREATE / EDIT TOPIC -->
<div class="modal-overlay" id="topic-modal" onclick="overlayClose(event,'topic-modal')">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <div class="modal-title" id="topic-modal-title">New Topic</div>
      <button class="modal-close" onclick="closeModal('topic-modal')">✕</button>
    </div>
    <input type="hidden" id="topic-edit-id" />
    <div class="form-group">
      <label>Title (16–128 chars)</label>
      <input type="text" id="topic-title-input"
             placeholder="A clear, descriptive title for your topic" />
    </div>
    <div class="form-group">
      <label>Content (32–8192 chars)</label>
      <textarea id="topic-content-input" rows="6"
                placeholder="Share your question, insight, or topic details…"></textarea>
    </div>
    <div class="check-row" style="margin-bottom:.75rem">
      <input type="checkbox" id="topic-private-check" />
      <label for="topic-private-check">Make this topic private</label>
    </div>
    <div class="error-msg" id="topic-error"></div>
    <div class="form-footer" style="justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal('topic-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="submitTopic()">Publish Topic</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
